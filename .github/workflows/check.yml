name: Check templates

# Every template must read with the app's own reader, say in its header what its path says,
# have the same shape in every language, have notes for each version, and appear in the
# catalogue exactly as the files make it. A published file never changes: a change is a new
# version.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Templates and catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Check the templates and the catalogue
        run: java -jar tools/templatecheck.jar check .

      - name: Published template files never change
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-status --diff-filter=MDR "origin/$BASE_REF...HEAD" -- 'templates/' \
            | grep -E '\.md$' | grep -v '/CHANGES\.md$' || true)
          if [ -n "$changed" ]; then
            echo "Published template files were changed, moved or removed. Add a new version instead:"
            echo "$changed"
            exit 1
          fi
